<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Character Card assignments.">
    <meta name="author" content="Joyce Koon">

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Character Card">
    <meta property="og:description" content="Character cards">
    <meta property="og:url" content="https://kaikoon25.github.io/wdd131/charactercard/index.html">
    <meta property="og:image" content="https://kaikoon25.github.io/wdd131/charactercard/images/SocialPreviewImage.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Character Card">
    <meta name="twitter:description" content="Character cards">
    <meta name="twitter:image" content="https://kaikoon25.github.io/wdd131/charactercard/images/SocialPreviewImage.png">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="favicon.ico">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">

    <title>Character Card</title>

    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    
    <div class="card" aria-label="Character Card">
        <img class="card-img">
        <h1 class="name"></h1>

        <div class="stats">
            <p class="class"></p>
            <p class="level"></p>
            <p class="health"></p>
        </div>

        <div class="buttons">
            <button id="attacked-button">Attacked</button>
            <button id="level-up-button">Level Up</button>
        </div>

    </div>

</body>
</html>
