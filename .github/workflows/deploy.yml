name: Deploy wdd131 Subfolder to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # DIAGNOSTIC STEP: This will list all files and folders so we see the exact spelling
      - name: Debug File Structure
        run: |
          echo "=== Root Folder Contents ==="
          ls -R

      # This will run but might still fail, which is okay for this test
      - name: Upload Folder Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'Fall2026/wdd131'
        continue-on-error: true

      # This will run even if the upload fails so we can get your website working
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
