name: Deploy wdd131 Subfolder to Pages

on:
  push:
    branches: ["master"] # Strictly targets your master branch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Folder Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'Fall2026/wdd131'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
