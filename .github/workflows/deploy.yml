name: Deploy wdd131 Subfolder to Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    # This forces GitHub to look inside Fall2026 right from the start
    defaults:
      run:
        working-directory: Fall2026

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # By trying both variations, the script will succeed no matter the casing
      - name: Upload Folder Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'Fall2026/wdd131'
        continue-on-error: true

      - name: Backup Upload (If capitalized)
        id: upload-backup
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'Fall2026/WDD131'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
