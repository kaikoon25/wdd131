<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Reviews</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.css">
    <link rel="stylesheet" href="movies.css">
    <script src="movies.js" defer></script>
</head>
<body>
        
    <header>
        <h1>Flick Picks</h1>
        <nav aria-label="main menu">
        <!-- The screen reader was unclear about the nav being a main menu, despite nav being a semantic element. This happens sometimes. -->
        <ul class="main-nav">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
        </nav>
    </header>

    <main id="main-content" role="main">
    <!-- role="main" helped the screen reader know it was at the main part of the page -->
        <section id="movie-list" aria-label="Movie Reviews">
        <!-- Screen reader says "movie reviews" which helps blind people know the website (this section) is about movie reviews. -->
            
        </section>
    </main>

    <footer>
    <p>&copy; Flick Picks</p>
    </footer>

</body>
</html>
