<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Event form assignments.">
    <meta name="author" content="Joyce Koon">

    <title>Event Ticket</title>

    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.css">
    <script src="script.js" defer></script>
</head>
<body>
<main class="wrapper">
    <h1>Event Ticket</h1>

    <!-- Event Ticket form. -->
    <form id="eventForm">
        <!-- first name  -->
        <div class="field">
            <label for="firstName">First Name</label>
            <input id="firstName" name="firstName" type="text" required>
        </div>

        <!-- last name -->
        <div class="field">
            <label for="lastName">Last Name</label>
            <input id="lastName" name="lastName" type="text" required>
        </div>

        <!-- email -->
        <div class="field full">
        <!-- Both the class of feild and full -->
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required>
        </div>

        <!-- type: student or geust -->
        <div class="field">
            <label for="travelRange">Type</label>
            <select
            id="travelRange"
            name="travelRange"
            required
            >
            <option value="">Choose one</option>
            <option value="student">Student</option>
            <option value="geust">Geust</option>
            </select>
        </div>

        <!-- event date -->
        <div class="field">
            <label for="eventDate">Event Date</label>
            <input id="eventDate" name="eventDate" type="date" required>
        </div>

        <!-- (hidden) student ID (for if student) -->
        <div id="studentIDContainer" class="field full" hidden>
            <label for="studentID">Student I#</label>
            <input id="studentID" name="studentID" type="text">
        </div>

        <!-- (hidden) access code (for is geust) (need to enter event code 'EVENT131') -->
        <div id="accessCodeContainer" class="field full" hidden>
            <label for="accessCode">Access Code</label>
            <input id="accessCode" name="accessCode" type="text">
        </div>

        <!-- Button "create ticket" -->
         <button class="feild full" type="submit">Create Ticket</button>
            
    </form>

    <section id="output" aria-live="polite"></section>

</main>
</body>
</html>
